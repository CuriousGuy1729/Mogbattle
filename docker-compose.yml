version: "3.9"

# Production backing services for Mogbattle.
# The app falls back to embedded stores when these are not configured,
# but for real deployments run PostgreSQL + Redis and set DATABASE_URL / REDIS_URL.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mogbattle
      POSTGRES_PASSWORD: mogbattle
      POSTGRES_DB: mogbattle
    ports:
      - "5432:5432"
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
